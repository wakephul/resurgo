# il pannello puo spegnere e riavviare senza password
permit nopass :resurgo cmd /sbin/poweroff
permit nopass :resurgo cmd /sbin/reboot
# il benvenuto puo spegnere e riaccendere le regolazioni di mantice, un comando esatto per riga
permit nopass :resurgo cmd /usr/bin/mantice args disattiva memoria
permit nopass :resurgo cmd /usr/bin/mantice args disattiva processore
permit nopass :resurgo cmd /usr/bin/mantice args disattiva disco
permit nopass :resurgo cmd /usr/bin/mantice args disattiva grafica
permit nopass :resurgo cmd /usr/bin/mantice args disattiva batteria
permit nopass :resurgo cmd /usr/bin/mantice args disattiva ventole
permit nopass :resurgo cmd /usr/bin/mantice args riattiva memoria
permit nopass :resurgo cmd /usr/bin/mantice args riattiva processore
permit nopass :resurgo cmd /usr/bin/mantice args riattiva disco
permit nopass :resurgo cmd /usr/bin/mantice args riattiva grafica
permit nopass :resurgo cmd /usr/bin/mantice args riattiva batteria
permit nopass :resurgo cmd /usr/bin/mantice args riattiva ventole
